<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" fill="none">
  <!-- Back-right card (rotated ~15deg clockwise) -->
  <g transform="translate(540,520) rotate(22)">
    <rect x="-200" y="-280" width="400" height="560" rx="50" ry="50" fill="white" stroke="#1a8fff" stroke-width="48"/>
  </g>
  <!-- Back-left card (rotated ~-15deg) -->
  <g transform="translate(540,520) rotate(-22)">
    <rect x="-200" y="-280" width="400" height="560" rx="50" ry="50" fill="white" stroke="#1a8fff" stroke-width="48"/>
  </g>
  <!-- Front card (no rotation) -->
  <g transform="translate(540,520)">
    <rect x="-200" y="-280" width="400" height="560" rx="50" ry="50" fill="white" stroke="#1a8fff" stroke-width="48"/>
    <!-- Heart -->
    <path d="M0,80
      C0,80 -130,-20 -130,-110
      C-130,-180 -65,-210 0,-150
      C65,-210 130,-180 130,-110
      C130,-20 0,80 0,80 Z"
      fill="#1a8fff"/>
  </g>
</svg>
